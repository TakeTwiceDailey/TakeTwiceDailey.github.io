<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="theme-base-0d" style="position: relative">

    <div class="wrap">

      {% include header.html %}

      <div id="hex-strap" data-target="home-container" data-row-height="74.59" class="hex-group fade-in" style="animation-delay: 2.5s"></div>

      <div id="faces">

        <div class="face center">
          <img src="/icons/my_face/01ConnerFaceBWTrans1000.webp" alt="Illustrated portrait of Conner Dailey">
        </div>

        <div id="id-1" class="center">
          <img src="/icons/my_face/ConnerFaceSunset.webp" alt="" aria-hidden="true">
        </div>

        <div id="id-2" class="center">
          <img src="/icons/my_face/ConnerFaceSpace.webp" alt="" aria-hidden="true">
        </div>

      </div>

      <div id="home-container" class="container content off-center">

        <div id="home-name" class="center">
            <h1 style="font-size: 300%; margin-top:15px"><a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a></h1>
        </div>

        <div id="home-tagline" class="center">
          {{ site.tagline }}
        </div>

        <br>
          {{ content }}
        <br>

      </div>

      <br>
      {% include footer.html %}
    </div>
    <br>

    <script src="{{ site.baseurl }}/public/js/site.js"></script>

  </body>
</html>
