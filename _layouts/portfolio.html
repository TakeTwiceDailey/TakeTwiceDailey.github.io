<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="theme-base-0d">

    {% include mathjax.html %}
    <div class="wrap">
      {% include header.html %}

      <div class="container content fade-in center">
          {{ content }}
        <br>

      </div>

      <br>

      <div class="gallery fade-in">
        {% for photo in site.data.photos %}
        <a href="{{ site.baseurl }}/photos/{{ photo.photo }}"><img src="{{ site.baseurl }}/photos/thumbnails/{{ photo.thumbnail }}"
          width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy"
          alt="{{ photo.caption | escape }}" title="{{ photo.caption | escape }}"></a>
        {% endfor %}
      </div>

      <br>
      {% include footer.html %}
    </div>

    <script src="{{ site.baseurl }}/public/js/site.js"></script>
    <script src="{{ site.baseurl }}/public/js/simple-lightbox.min.js"></script>
    <script>
      new SimpleLightbox('.gallery a', {
        animationSpeed: 200,
        disableRightClick: true,
        disableScroll: true
      });
    </script>

  </body>
</html>
