# Dependencies
markdown:         kramdown
highlighter:      rouge # changed from `pygments` as github says so
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
# Permalinks
#
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty
relative_permalinks: false

# Setup
title:               Conner Dailey
tagline:             'Theoretical Physicist, hobby photographer'
description:         'Theoretical Physicist, hobby photographer.'
url:                 https://taketwicedailey.com
baseurl:             ''
paginate:            5
paginate_path:       '/blog/page:num/'

# About/contact
author:
  name: Conner Dailey
  email: c.dailey18@gmail.com
  instagram: taketwicedailey
  linkedin: taketwicedailey
  github: TakeTwiceDailey
  orcid: http://orcid.org/0000-0003-2488-3461
  google_scholar: https://scholar.google.com/citations?user=mPNwR5sAAAAJ&hl=en

# Research functionality

collections:
   research:
     output: true

# Used by jekyll-seo-tag for link previews and search engine data
lang: en_US
social:
  name: Conner Dailey
  links:
    - https://github.com/TakeTwiceDailey
    - https://www.linkedin.com/in/taketwicedailey
    - https://instagram.com/taketwicedailey
    - https://orcid.org/0000-0003-2488-3461
    - https://scholar.google.com/citations?user=mPNwR5sAAAAJ

defaults:
  - scope:
      path: ""
    values:
      image: /icons/conner-dailey.jpg

# Files that should not be published as part of the site
exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - vendor
